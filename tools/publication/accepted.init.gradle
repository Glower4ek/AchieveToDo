// Current reproduction of the immutable accepted 0.1.5.4 test selection.
// Historical adapters and records are preserved; only the historical-byte reader is replaced.
allprojects {
    afterEvaluate {
        def final19Sources = file('tools/final19/java')
        sourceSets.test.java.setSrcDirs(sourceSets.test.java.srcDirs.findAll { it != final19Sources })
        tasks.named('compileTestJava') {
            source fileTree(final19Sources) {
                exclude '**/Final19PreservedSemanticBridge.java', '**/Final19CombatEvidence.java'
            }
            source fileTree('reference/phase_a_planning/pre26_2_smoke_bugfix_0_1_5_2/java') {
                exclude '**/Pre26SmokeAcceptedSources.java'
            }
            source fileTree('reference/phase_a_planning/pre26_2_smoke_bugfix_0_1_5_4/java') {
                exclude '**/Pre26SmokeAcceptedSources.java'
            }
            source fileTree('tools/publication/java')
        }
        sourceSets.test.java.srcDir(file('reference/phase_a_planning/pre26_2_final_build/java'))
        tasks.register('preparePublicationRuntime', JavaExec) {
            dependsOn testClasses
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'com.diskree.achievetodo.certification.PublicationRuntimeSetup'
            args = [projectDir.absolutePath]
        }
        tasks.named('test') { dependsOn 'preparePublicationRuntime' }
    }
}
