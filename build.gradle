}

// Gradle's --system-prop values belong to the build JVM; forward the Fabric GameTest
// selection controls to the forked server so a requested narrow run stays narrow.
tasks.named('runGameTest', JavaExec) {
    doFirst {
        systemProperty('achievetodo.phaseA.projectRoot', project.projectDir.absolutePath)
        ['fabric-api.gametest.filter', 'fabric-api.gametest.verify', 'fabric-api.gametest.report-file'].each { propertyName ->
            String propertyValue = System.getProperty(propertyName)
            if (propertyValue != null) {
                systemProperty(propertyName, propertyValue)
            }
        }
    }
}

