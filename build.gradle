tasks.register('generateBuildConfig', DefaultTask) {
    inputs.file(layout.projectDirectory.file('gradle/BuildConfig.java.txt'))
    inputs.properties([javaNamespace: javaNamespace, modId: modId, modName: modName, modVersion: modVersion])
    outputs.dir(generatedBuildConfigDir)
    doLast {
        def templateFile = file("$projectDir/gradle/BuildConfig.java.txt")
        def namespacePath = project.javaNamespace.replace('.', '/')
        def configFile = generatedBuildConfigDir.get().file("${namespacePath}/${modId}/BuildConfig.java").asFile
        configFile.getParentFile().mkdirs()

        configFile.setText(templateFile.getText('UTF-8')
            .replace('${javaNamespace}', javaNamespace)
            .replace('${modId}', modId)
            .replace('${modName}', modName)
            .replace('${modVersion}', modVersion), 'UTF-8')
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(minJavaVersion.toInteger())
    sourceCompatibility = targetCompatibility = minJavaVersion.toInteger()
}

jar {
    doFirst {
        if (modVersion ==~ /\d+\.\d+\.\d+\.\d+/ && archiveFile.get().asFile.exists()) {
            throw new GradleException("Smoke candidate ${modVersion} already exists; increment the final modVersion component before producing a changed JAR.")
        }
    }
    from('LICENSE') {
        rename { "${it}_${modId}" }
    }
    file('licenses')
        .listFiles()
        .findAll { it.isDirectory() }
        .each { dir ->
            from(dir) {
                include 'LICENSE'
                rename {
                    "LICENSE_${dir.name}"
                }
            }
        }
    compileJava.dependsOn(generateBuildConfig)
}

loom {
    accessWidenerPath.set(file("src/main/resources/${modId}.classtweaker"))

    runs {
        gameTest {
            vmArg "-Dachievetodo.phaseA.projectRoot=${projectDir.absolutePath}"
        }
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${modId}"

            runDir "build/datagen"
        }
    }
}

