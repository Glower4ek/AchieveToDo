plugins {
    id 'net.fabricmc.fabric-loom' version "${loomVersion}"
}

def modId = project.modName.toLowerCase()
def repoUrl = project.repoUrl

version = "mc${minMinecraftVersion}+${modVersion}"
group = project.javaNamespace

base {
    archivesName = modId
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minMinecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${minLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}+${minMinecraftVersion}"
    implementation "com.moandjiezana.toml:toml4j:${tomlVersion}"
    implementation(include("com.moandjiezana.toml:toml4j:${tomlVersion}"))
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def propertyMap = [
        'modId'              : modId,
        'modVersion'         : modVersion,
        'modName'            : modName,
        'author'             : author,
        'repoUrl'            : repoUrl,
        'minJavaVersion'     : minJavaVersion,
        'minMinecraftVersion': minMinecraftVersion,
        'minLoaderVersion'   : minLoaderVersion,
        'apiVersion'         : apiVersion
    ]
    inputs.properties(propertyMap)
    filesMatching("fabric.mod.json") {
        expand(propertyMap)
    }
}

sourceSets {
    main {
        resources.srcDirs += ['src/main/generated']
        java.srcDirs += ['src/main/generated/java']
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(minJavaVersion.toInteger())
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

fabricApi {
    configureTests {
        createSourceSet = true
        getModId().set("achievetodo-test")
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

// The Phase A family catalogs and independent validators are compiled in test, while the
// retained joined-player GameTests need those same fail-closed classes at runtime.
sourceSets {
    gametest {
        compileClasspath += sourceSets.test.output
        runtimeClasspath += sourceSets.test.output
    }
}

tasks.named('compileGametestJava') {
    dependsOn testClasses
}

// Gradle's --system-prop values belong to the build JVM; forward the Fabric GameTest
// selection controls to the forked server so a requested narrow run stays narrow.
tasks.named('runGameTest', JavaExec) {
    doFirst {
        systemProperty('achievetodo.phaseA.projectRoot', project.projectDir.absolutePath)
        ['fabric-api.gametest.filter', 'fabric-api.gametest.verify', 'fabric-api.gametest.report-file'].each { propertyName ->
            String propertyValue = System.getProperty(propertyName)
            if (propertyValue != null) {
                systemProperty(propertyName, propertyValue)
            }
        }
    }
}

