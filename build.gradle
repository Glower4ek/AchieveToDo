// New singleton transactions retain explicit TEMP audit and separate promotion.
['AncientRestoration', 'SilkTouchNest'].each { front ->
    tasks.register("writePhaseASingleton${front}Certification", JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "com.diskree.achievetodo.certification.PhaseASingleton${front}Certification"
        args = [projectDir.absolutePath]
    }
    ['Temporary': 'temporary', 'Promotable': 'promotable', 'Persistent': 'persistent', 'Promotion': 'promote'].each { label, mode ->
        tasks.register("auditPhaseASingleton${front}${label}", JavaExec) {
            dependsOn 'gametestClasses'
            classpath = sourceSets.gametest.runtimeClasspath
            mainClass = "com.diskree.achievetodo.certification.PhaseASingleton${front}ExecutionEvidence"
            args = [mode, projectDir.absolutePath]
        }
    }
}
