def verifyCleanSourceInputs = tasks.register('verifyCleanSourceInputs', Exec) {
    inputs.file('src/test/resources/build_inputs/manifest.json')
    commandLine System.getenv('ACHIEVETODO_PYTHON'), '-B', '-X', 'utf8',
        file('tools/build/verify_inputs.py').absolutePath,
        '--external-root', System.getenv('ACHIEVETODO_TEST_INPUTS_DIR') ?: ''
}
tasks.withType(Test).configureEach {
    dependsOn verifyCleanSourceInputs
    inputs.files(loom.namedMinecraftJars)
    inputs.file('src/test/resources/build_inputs/manifest.json')
    outputs.upToDateWhen { false }
    environment 'ACHIEVETODO_TEST_INPUTS_DIR', System.getenv('ACHIEVETODO_TEST_INPUTS_DIR') ?: ''
    systemProperty 'achievetodo.python', System.getenv('ACHIEVETODO_PYTHON')
    doFirst {
        // Resolve task/provider values; do not execute asset download/acquisition.
        def assetTask = tasks.named('downloadAssets').get()
        def assetIndex = loom.minecraftProvider.versionInfo.assetIndex()
        def assetsRoot = assetTask.assetsDirectory.get().asFile
        def indexFile = new File(assetsRoot, "indexes/${assetIndex.fabricId(minMinecraftVersion)}.json")
        def indexBytes = indexFile.bytes
        if (indexBytes.length != assetIndex.size() || java.security.MessageDigest.getInstance('SHA-1').digest(indexBytes).encodeHex().toString() != assetIndex.sha1()) {
            throw new GradleException('Vanilla asset index identity mismatch')
        }
        def object = new groovy.json.JsonSlurper().parse(indexFile, 'UTF-8').objects['minecraft/lang/ru_ru.json']
        def ruFile = new File(assetsRoot, "objects/${object.hash.substring(0,2)}/${object.hash}")
        if (ruFile.length() != object.size || java.security.MessageDigest.getInstance('SHA-1').digest(ruFile.bytes).encodeHex().toString() != object.hash) {
            throw new GradleException('Vanilla RU asset identity mismatch')
        }
        systemProperty 'achievetodo.minecraftJar', loom.namedMinecraftJars.singleFile.absolutePath
        systemProperty 'achievetodo.vanillaRu', ruFile.absolutePath
        systemProperty 'achievetodo.vanillaRuSha1', object.hash
    }
}

