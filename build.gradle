// CACHE-BASELINE-LIMITED selected bytes, not publisher-origin authentication.
// This supplementary check's ordering relative to plugin resolution is UNPROVED.
// A later authorized Gradle lifecycle/tamper audit is required.
buildscript {
    if (gradle.startParameter.dependencyVerificationMode.toString() != 'STRICT') {
        throw new GradleException('Strict dependency verification required')
    }
    def python = System.getenv('ACHIEVETODO_PYTHON')
    if (!python) throw new GradleException('Explicit ACHIEVETODO_PYTHON executable required')
    def verifierFile = new File(projectDir, 'tools/build/verify_inputs.py')
    def manifestFile = new File(projectDir, 'src/test/resources/build_inputs/manifest.json')
    if (java.security.MessageDigest.getInstance('SHA-256').digest(verifierFile.bytes).encodeHex().toString() != '92617b59c39cf94f708f895d81a3b2c763b0d7434271716cadb6315b5bf392ce' ||
        java.security.MessageDigest.getInstance('SHA-256').digest(manifestFile.bytes).encodeHex().toString() != '1dbe9d7cd2fe653454f8692b7cdf5e54787c3df74eb12461c01164b99190ac77') {
        throw new GradleException('Verifier/manifest byte identity mismatch')
    }
    def verifier = new ProcessBuilder(python, '-B', '-X', 'utf8', verifierFile.absolutePath,
        '--dependencies', '--source-root', projectDir.absolutePath,
        '--gradle-user-home', gradle.gradleUserHomeDir.absolutePath)
        .directory(projectDir).redirectErrorStream(true).start()
    def output = verifier.inputStream.getText('UTF-8')
    if (verifier.waitFor() != 0) throw new GradleException(output)
    logger.lifecycle(output.trim())
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loomVersion}"
}

def modId = project.modName.toLowerCase(Locale.ROOT)
def repoUrl = project.repoUrl

version = "mc${minMinecraftVersion}+${modVersion}"
group = project.javaNamespace

base {
    archivesName = modId
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minMinecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${minLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}+${minMinecraftVersion}"
    implementation "com.moandjiezana.toml:toml4j:${tomlVersion}"
    implementation(include("com.moandjiezana.toml:toml4j:${tomlVersion}"))
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def propertyMap = [
        'modId'              : modId,
        'modVersion'         : modVersion,
        'modName'            : modName,
        'author'             : author,
        'repoUrl'            : repoUrl,
        'minJavaVersion'     : minJavaVersion,
        'minMinecraftVersion': minMinecraftVersion,
        'minLoaderVersion'   : minLoaderVersion,
        'apiVersion'         : apiVersion
    ]
    inputs.properties(propertyMap)
    filesMatching("fabric.mod.json") {
        expand(propertyMap)
    }
}

def generatedBuildConfigDir = layout.buildDirectory.dir('generated/sources/buildConfig/java/main')
sourceSets {
    main {
        resources.srcDirs += ['src/main/generated']
        resources.exclude('.cache/**', 'java/**')
